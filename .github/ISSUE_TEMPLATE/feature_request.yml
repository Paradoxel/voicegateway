name: Feature request
description: Something VoiceGateway should do that it does not.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and where VoiceGateway gets in the way. Describe the use case, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: Optional. A sketch of the API, command or screen you have in mind.
