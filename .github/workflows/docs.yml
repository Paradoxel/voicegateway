name: Docs

# The docs site in site/docs/ is a Fumadocs static export. ci.yml only triggers on
# src/voicegateway/** and friends, so without this a docs-only PR had no gate:
# a page with broken MDX or a bad link would merge clean and fail the deploy.

on:
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/docs.yml'

# Build-only: the job reads the repo and writes nothing back.
permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site/docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/docs/package-lock.json
      # House voice: colons and commas, never an em dash.
      - name: No em dashes
        run: '! grep -rn "—" content/'
      - run: npm ci
      - run: npm run build
