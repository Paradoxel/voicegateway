<h2>What this report does not measure</h2>
<p>Read this section before acting on anything above. A load run measures a fleet from outside, through a generator placing real calls, and these are its structural limits, not this run&rsquo;s bad luck.</p>
<ul>
<li>RTP-port headroom IS measured, from the media port range&#x27;s own occupancy against its configured size. The range size is a DECLARED configuration value rather than a measurement, so a node publishing occupancy without it reports unmeasured rather than being divided by a guess.</li>
<li>Network headroom is measured against a DECLARED baseline, not a measured capacity. The ENA driver reports no link speed, so there is no capacity to measure; the denominator is the instance type&#x27;s published baseline, supplied by an operator at import. The instance can burst above it, so that figure is a floor rather than a ceiling and the ratio over-reads rather than under-reads. Inbound and outbound are judged separately because the hypervisor maintains separate credit buckets.</li>
<li>Packets-per-second headroom is NOT measured and never will be. No per-instance-type PPS allowance is published by anyone, including AWS, so there is no denominator to divide by. PPS saturation is still detected as an EVENT by the allowance gate; what cannot be quantified is how much headroom remained.</li>
<li>Per-call packet loss is NOT measured. No server-side surface attributes loss to one participant&#x27;s leg, so no loss figure appears per call anywhere in this report.</li>
<li>Node samples are correlated to a test by TIME WINDOW OVERLAP. They say what the fleet was doing while a test ran, never that a node served any particular call: there is no per-call identity at that layer.</li>
<li>Peak CPU and memory are the WORST node&#x27;s peak over the window, not a fleet average. A tier that looks healthy on average can contain one node that breached.</li>
<li>The calls-per-node figure is only meaningful if the generator actually reached each step. A ramp holding its arrival rate fixed while raising the target concurrency plateaus, and that plateau is the generator&#x27;s ceiling rather than the node&#x27;s.</li>
<li>Every call here was placed from ONE vantage point: the host that ran the generator. The establishment rate is what that host achieved against this deployment over that path, not what a caller on another network would see.</li>
</ul>
